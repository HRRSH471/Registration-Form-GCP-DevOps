name: Deploy QA Environment

on:
  push:
    branches:
      - qa

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.GCP_HOST_QA }} >> ~/.ssh/known_hosts

      - name: Deploy to QA VM
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.GCP_USER_QA }}@${{ secrets.GCP_HOST_QA }} << 'EOF'

          cd /home/hariom/Registration-Form-GCP-DevOps

          git checkout qa
          git pull origin qa

          pip3 install -r registration-app/requirements.txt

          sudo systemctl restart registration-app
          sudo systemctl restart nginx

          echo "QA Deployment Successful"

          EOF
